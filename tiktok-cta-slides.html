<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1920">
<title>TikTok CTA</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { 
  width: 1080px; 
  height: 1920px; 
  background: #000; 
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  overflow: hidden;
  position: relative;
}
.gradient-overlay {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: radial-gradient(ellipse at 30% 20%, rgba(255,102,0,0.15) 0%, transparent 50%);
  pointer-events: none;
}
.left-section {
  position: absolute;
  left: 60px;
  top: 50%;
  transform: translateY(-50%) rotate(-90deg);
  transform-origin: left center;
  white-space: nowrap;
}
.brand-text {
  font-size: 42px;
  font-weight: 900;
  letter-spacing: 8px;
  color: #FF6600;
  text-shadow: 0 0 30px rgba(255,102,0,0.5);
}
.center-section {
  position: absolute;
  top: 180px;
  left: 50%;
  transform: translateX(-50%);
  width: 700px;
  text-align: center;
}
.cta-badge {
  display: inline-block;
  background: linear-gradient(135deg, #FF6600, #FF8533);
  color: #000;
  padding: 16px 40px;
  border-radius: 50px;
  font-size: 26px;
  font-weight: 800;
  letter-spacing: 2px;
  margin-bottom: 60px;
  box-shadow: 0 8px 40px rgba(255,102,0,0.5);
  animation: pulse 2s ease-in-out infinite;
}
@keyframes pulse {
  0%, 100% { transform: scale(1); box-shadow: 0 8px 40px rgba(255,102,0,0.5); }
  50% { transform: scale(1.02); box-shadow: 0 12px 50px rgba(255,102,0,0.7); }
}
.prompt-box {
  background: linear-gradient(180deg, #1a1a1a 0%, #0d0d0d 100%);
  border: 3px solid #FF6600;
  border-radius: 20px;
  padding: 35px 45px;
  margin-bottom: 25px;
  box-shadow: 0 0 30px rgba(255,102,0,0.3), inset 0 0 20px rgba(255,102,0,0.1);
}
.prompt-label {
  font-size: 18px;
  color: #FF6600;
  letter-spacing: 3px;
  margin-bottom: 15px;
  font-weight: 600;
}
.prompt-text {
  font-size: 32px;
  color: #fff;
  font-weight: 500;
}
.arrow-down {
  width: 60px;
  height: 60px;
  margin: 15px auto;
  position: relative;
}
.arrow-down::before {
  content: '';
  position: absolute;
  left: 50%;
  top: 0;
  transform: translateX(-50%);
  border-left: 20px solid transparent;
  border-right: 20px solid transparent;
  border-top: 25px solid #FF6600;
}
.arrow-down::after {
  content: '';
  position: absolute;
  left: 50%;
  top: 15px;
  transform: translateX(-50%);
  border-left: 15px solid transparent;
  border-right: 15px solid transparent;
  border-top: 20px solid #000;
}
.enhanced-box {
  background: linear-gradient(180deg, #1a1a1a 0%, #0d0d0d 100%);
  border: 3px solid #FF6600;
  border-radius: 20px;
  padding: 35px 45px;
  box-shadow: 0 0 40px rgba(255,102,0,0.4), inset 0 0 30px rgba(255,102,0,0.15);
  position: relative;
  overflow: hidden;
}
.enhanced-box::before {
  content: '';
  position: absolute;
  top: -50%;
  left: -50%;
  width: 200%;
  height: 200%;
  background: linear-gradient(45deg, transparent, rgba(255,102,0,0.1), transparent);
  animation: shimmer 3s infinite;
}
@keyframes shimmer {
  0% { transform: translateX(-100%) rotate(45deg); }
  100% { transform: translateX(100%) rotate(45deg); }
}
.enhanced-label {
  font-size: 18px;
  color: #FF6600;
  letter-spacing: 3px;
  margin-bottom: 15px;
  font-weight: 600;
  position: relative;
  z-index: 1;
}
.enhanced-text {
  font-size: 24px;
  color: #fff;
  line-height: 1.6;
  position: relative;
  z-index: 1;
}
.enhanced-text .highlight {
  color: #FF6600;
  font-weight: 700;
}
.sparkle {
  position: absolute;
  color: #FF6600;
  animation: twinkle 1.5s ease-in-out infinite;
}
.sparkle-1 { top: 250px; right: 150px; font-size: 50px; animation-delay: 0s; }
.sparkle-2 { top: 400px; right: 100px; font-size: 35px; animation-delay: 0.3s; }
.sparkle-3 { top: 550px; right: 180px; font-size: 40px; animation-delay: 0.6s; }
.sparkle-4 { top: 700px; right: 120px; font-size: 30px; animation-delay: 0.9s; }
@keyframes twinkle {
  0%, 100% { opacity: 0.4; transform: scale(0.8); }
  50% { opacity: 1; transform: scale(1.1); }
}
.bottom-cta {
  position: absolute;
  bottom: 120px;
  left: 50%;
  transform: translateX(-50%);
  text-align: center;
}
.main-cta {
  background: linear-gradient(135deg, #FF6600 0%, #FF8533 50%, #FF6600 100%);
  color: #000;
  padding: 28px 70px;
  border-radius: 60px;
  font-size: 32px;
  font-weight: 900;
  letter-spacing: 3px;
  box-shadow: 0 10px 50px rgba(255,102,0,0.6);
  animation: glow 2s ease-in-out infinite;
}
@keyframes glow {
  0%, 100% { box-shadow: 0 10px 50px rgba(255,102,0,0.6); }
  50% { box-shadow: 0 15px 60px rgba(255,102,0,0.9); }
}
.orange-line {
  position: absolute;
  bottom: 0;
  left: 0;
  width: 100%;
  height: 8px;
  background: linear-gradient(90deg, transparent, #FF6600, transparent);
}
</style>
</head>
<body>
<div class="gradient-overlay"></div>

<div class="left-section">
  <div class="brand-text">PROMPT ARCHITECT</div>
</div>

<div class="sparkle sparkle-1">✦</div>
<div class="sparkle sparkle-2">✦</div>
<div class="sparkle sparkle-3">✦</div>
<div class="sparkle sparkle-4">✦</div>

<div class="center-section">
  <div class="cta-badge">🔥 TAP THE LINK IN BIO ↓</div>
  
  <div class="prompt-box">
    <div class="prompt-label">YOUR PROMPT</div>
    <div class="prompt-text">"draw a dog"</div>
  </div>
  
  <div class="arrow-down"></div>
  
  <div class="enhanced-box">
    <div class="enhanced-label">ENHANCED PROMPT ✨</div>
    <div class="enhanced-text">
      A realistic golden retriever with soft fur, <span class="highlight">warm lighting</span>, 
      <span class="highlight">detailed eyes</span>, sitting in a <span class="highlight">golden hour</span> 
      meadow, <span class="highlight">8K quality</span>, professional photography
    </div>
  </div>
</div>

<div class="bottom-cta">
  <div class="main-cta">TAP THE LINK IN BIO ↓</div>
</div>

<div class="orange-line"></div>
</body>
</html>
